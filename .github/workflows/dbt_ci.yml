name: dbt Cloud CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dbt-cloud-ci:
    name: Run dbt Cloud CI Job
    runs-on: ubuntu-latest

    steps:
      - name: Trigger dbt Cloud CI Job
        id: trigger
        run: |
          echo "Triggering dbt Cloud CI job..."

          RESPONSE=$(curl --fail --silent --show-error \
            --request POST \
            "https://or552.us1.dbt.com/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/jobs/${{ secrets.DBT_CLOUD_JOB_ID }}/run/" \
            --header "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data "{\"cause\":\"GitHub Pull Request #${{ github.event.pull_request.number }}\"}")

          echo "$RESPONSE"

          RUN_ID=$(echo "$RESPONSE" | jq -r '.data.id')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Failed to create dbt Cloud run."
            exit 1
          fi

          echo "Run ID: $RUN_ID"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for dbt Cloud run
        run: |

          echo "Waiting for dbt Cloud job..."

          MAX_ATTEMPTS=80

          for ((i=1;i<=MAX_ATTEMPTS;i++)); do

            RESPONSE=$(curl --fail --silent \
              --header "Authorization: Token ${{ secrets.DBT_CLOUD_API_TOKEN }}" \
              "https://or552.us1.dbt.com/api/v2/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/${{ steps.trigger.outputs.run_id }}/")

            STATUS=$(echo "$RESPONSE" | jq -r '.data.status')

            echo "Attempt $i - Status: $STATUS"

            case "$STATUS" in
              10)
                echo "✅ dbt Cloud CI succeeded."
                exit 0
                ;;

              20)
                echo "❌ dbt Cloud CI failed (Error)."
                exit 1
                ;;

              30)
                echo "❌ dbt Cloud CI cancelled."
                exit 1
                ;;

              *)
                sleep 15
                ;;
            esac

          done

          echo "❌ Timeout waiting for dbt Cloud."
          exit 1

      - name: Print dbt Cloud Run URL
        if: always()
        run: |
          echo ""
          echo "dbt Cloud Run:"
          echo "https://or552.us1.dbt.com/#/accounts/${{ secrets.DBT_CLOUD_ACCOUNT_ID }}/runs/${{ steps.trigger.outputs.run_id }}/"