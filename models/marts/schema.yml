version: 2

models:
  - name: fct_order_items
    description: >
      Fact table at the order line item grain (one row per product sold within an order).
      Combines revenue calculations, store details, and product details into a single
      denormalized table, ready for self-service consumption in BI tools. Includes all
      order statuses (no filtering applied — analysts should filter on order_status
      depending on whether they need realized or gross revenue).

    columns:
      - name: order_item_id
        description: Primary key. Surrogate key from order_id and item_id.
        tests:
          - not_null
          - unique

      - name: order_id
        description: Foreign key. Identifier to the order this line item belongs to.
        tests:
          - not_null

      - name: order_date
        description: Date the order was placed.
        tests:
          - not_null

      - name: order_status
        description: "Status code of the order: 1 = Pending, 2 = Processing, 3 = Rejected, 4 = Completed."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

      - name: customer_id
        description: Foreign key. Identifier to the customer who placed the order.

      - name: staff_id
        description: Foreign key. Identifier to the staff member who handled the order.

      - name: product_id
        description: Foreign key. Identifier to the product sold in this line item.
        tests:
          - not_null

      - name: product_name
        description: Name of the product.

      - name: model_year
        description: Model year of the product (e.g. 2016).

      - name: brand_id
        description: Foreign key. Identifier to the product's brand.

      - name: brand_name
        description: Name of the product's brand.

      - name: category_id
        description: Foreign key. Identifier to the product's category.

      - name: category_name
        description: Name of the product's category.

      - name: store_id
        description: Foreign key. Identifier to the store that processed the order.
        tests:
          - not_null

      - name: store_name
        description: Name of the store.

      - name: store_city
        description: City where the store is located.

      - name: store_state
        description: State where the store is located.

      - name: quantity
        description: Number of units sold in this line item.
        tests:
          - not_null

      - name: list_price
        description: Unit price of the product at the time of sale, before discount.
        tests:
          - not_null

      - name: discount
        description: Discount rate applied to this line item, expressed as a decimal fraction (e.g. 0.2 = 20%).

      - name: gross_revenue
        description: Revenue before discount (quantity * list_price).
        tests:
          - not_null

      - name: net_revenue
        description: Revenue after discount (quantity * list_price * (1 - discount)). Main metric for revenue analysis.
        tests:
          - not_null

      - name: discount_amount
        description: Value of the discount applied (quantity * list_price * discount).

  - name: mrt_order_items_daily_report
    description: "{{ doc('mrt_order_items_daily_report') }}"

    columns:
      - name: order_date
        description: Date the metrics are aggregated for. Grain of this model — one row per day.
        tests:
          - not_null
          - unique

      - name: total_gross_revenue
        description: Total revenue before discount, summed across all order items for the day.
        tests:
          - not_null

      - name: total_net_revenue
        description: Total revenue after discount, summed across all order items for the day. Main metric for revenue trend analysis.
        tests:
          - not_null

      - name: total_discount_amount
        description: Total value of discounts applied, summed across all order items for the day.
        tests:
          - not_null

      - name: total_units_sold
        description: Total number of units sold across all order items for the day.
        tests:
          - not_null

      - name: total_orders
        description: Number of distinct orders placed on the day.
        tests:
          - not_null
      
      - name: average_order_value
        description: Average net revenue per order for the day (total_net_revenue / total_orders).
        tests:
          - not_null