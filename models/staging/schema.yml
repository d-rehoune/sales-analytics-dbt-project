version: 2

models:
  - name: stg_localbike_database__brands
    description: This model contains information about bike brands
  
    columns:
      - name: brand_id
        description: Primary key, This is a unique indentifier for the brand
        tests:
          - not_null
          - unique
      
      - name: brand_name
        description: Name of the brand
  
  - name: stg_localbike_database__categories
    description: Thise model contains information about product categories

    columns:
      - name: category_id
        description: Primary key, This is a unique indentifier for the category
        tests:
          - not_null
          - unique
          
      - name: category_name
        description: Name of category
  
  - name: stg_localbike_database__customers
    description: This model contains informations about customers

    columns:
      - name: customer_id
        description: Primary key, This is a unique indentifier for the customer
        tests:
          - not_null
          - unique
      
      - name: first_name
        description: First name of customer
      
      - name: last_name
        description: Last name of customer
      
      - name: phone
        description: Phone number of customer
      
      - name: email
        description: Email adress of the custumer
      
      - name: street
        description: State of the customer
      
      - name: city
        description: City of the customer
      
      - name: state
        description: State of the customer

      - name: zip_code
        description: Zip code of the customer
  
  - name: stg_localbike_database__orders
    description: This model contains information about customer orders, including order status and shipping dates

    columns:
      - name: order_id
        description: Primary key. Unique identifier for the order
        tests:
          - not_null
          - unique

      - name: customer_id
        description: Foreign key. Identifier to the customer who placed the order
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__customers')
              field: customer_id   

      - name: order_status
        description: "Status code of the order: 1 = Pending, 2 = Processing, 3 = Rejected, 4 = Completed."
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
              config:
                quote: false
      
      - name: order_date
        description: Date the order was placed
        tests:
          - not_null

      - name: required_date
        description: Date the customer requested the order to be delivered by
      
      - name: shipped_date
        description: Date the order was actually shipped. Null if the order has not been shipped yet

      - name: store_id
        description: Foreign key. Identifier to the store that processed the order
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__stores')
              field: store_id
      
      - name: staff_id
        description: Foreign key. Identifier to the staff member who handled the order
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__staffs')
              field: staff_id
      
  - name: stg_localbike_database__order_items
    description: This model contains the line items of each order, at the product level (one row per product within an order)

    columns:
      - name: order_item_id
        description: Primary key. Unique identifier, generated by concatenating order_id and item_id
        tests:
          - not_null
          - unique

      - name: order_id
        description: Foreign key. Identifier to the order this line item belongs to
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__orders')
              field: order_id

      - name: item_id
        description: Sequential identifier of the line item within an order
        tests:
          - not_null

      - name: product_id
        description: Foreign key. Identifier to the product sold in this line item
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__products')
              field: product_id

      - name: quantity
        description: Number of units of the product sold in this line item
        tests:
          - not_null

      - name: list_price
        description: Unit price of the product at the time of sale, before discount
        tests:
          - not_null

      - name: discount
        description: Discount rate applied to this line item, expressed as a decimal fraction (e.g. 0.2 = 20%)
  
  - name: stg_localbike_database__products
    description: This model contains information about bikes and accessories sold by Local Bike

    columns:
      - name: product_id
        description: Primary key. Unique identifier for the product
        tests:
          - not_null
          - unique

      - name: product_name
        description: Name of the product
        tests:
          - not_null

      - name: brand_id
        description: Foreign key. Identifier to the product's brand
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__brands')
              field: brand_id

      - name: category_id
        description: Foreign key. Identifier to the product's category
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__categories')
              field: category_id

      - name: model_year
        description: Model year of the product (e.g. 2016). Stored as an integer, not a date, since only the year is known

      - name: list_price
        description: Standard list price of the product, before any discount
        tests:
          - not_null

   - name: stg_localbike_database__staffs
    description: This model contains information about Local Bike employees

    columns:
      - name: staff_id
        description: Primary key. Unique identifier for the staff member
        tests:
          - not_null
          - unique

      - name: store_id
        description: Foreign key. Identifier to the store the staff member works at
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__stores')
              field: store_id

      - name: manager_id
        description: Foreign key. Identifier to the staff member's manager. Null if the staff member has no manager (e.g. top-level manager)
        tests:
          - relationships:
              to: ref('stg_localbike_database__staffs')
              field: staff_id

      - name: first_name
        description: First name of the staff member

      - name: last_name
        description: Last name of the staff member

      - name: email
        description: Email address of the staff member

      - name: phone
        description: Phone number of the staff member

      - name: active
        description: "Flag indicating whether the staff member is currently active: 1 = active, 0 = inactive"
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
              config:
                quote: false
  
  - name: stg_localbike_database__stocks
    description: This model contains inventory levels for each product at each store

    columns:
      - name: stock_id
        description: Primary key. Unique identifier, generated by concatenating store_id and product_id
        tests:
          - not_null
          - unique

      - name: store_id
        description: Foreign key. Identifier to the store holding the stock
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__stores')
              field: store_id

      - name: product_id
        description: Foreign key. Indentifier to the product in stock
        tests:
          - not_null
          - relationships:
              to: ref('stg_localbike_database__products')
              field: product_id

      - name: quantity
        description: Number of units currently in stock
        tests:
          - not_null

  - name: stg_localbike_database__stores
    description: This model contains information about Local Bike's physical store locations

    columns:
      - name: store_id
        description: Primary key. Unique identifier for the store
        tests:
          - not_null
          - unique

      - name: store_name
        description: Name of the store
        tests:
          - not_null

      - name: phone
        description: Phone number of the store

      - name: email
        description: Email address of the store

      - name: street
        description: Street address of the store

      - name: city
        description: City where the store is located

      - name: state
        description: State where the store is located

      - name: zip_code
        description: Zip code of the store, stored as a string to preserve leading zeros